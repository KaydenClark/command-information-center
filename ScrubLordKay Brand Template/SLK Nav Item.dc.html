<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}button{font:inherit}</style>
</helmet>
<button style="{{ itemStyle }}" style-hover="{filter:'brightness(1.08)'}"><span style="display:inline-flex;align-items:center">{{ children }}</span><span>{{ label }}</span></button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:56},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    var active = !!this.props.active;
    var on = 'linear-gradient(90deg,#F4AC45,rgba(244,172,69,0.4))';
    var style = 'width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;border:0;border-radius:6px;text-align:left;font-family:Segoe UI,system-ui,sans-serif;font-size:13px;cursor:pointer;transition:filter .15s ease;'
      + (active
        ? ('background:' + on + ';color:#0A0A0A;font-weight:600;')
        : 'background:transparent;color:rgba(247,245,242,0.62);');
    return { itemStyle: style };
  }
}
</script>
</body>
</html>
