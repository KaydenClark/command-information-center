<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="display:flex;align-items:baseline;gap:14px">
<span style="font-family:'Playfair Display',serif;font-weight:900;font-size:26px;color:#3a3a3a">{{ num }}</span>
<span style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#7d7d7d">{{ label }}</span>
<span style="flex:1;height:1px;background:linear-gradient(90deg,#2a2a2a,transparent)"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:40},&quot;num&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Section header&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
